<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyTest - Flashcards de PDF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <section id="upload-area">
            <h1>Crea tus Flashcards</h1>
            <p>Sube un PDF con preguntas y nosotros hacemos el resto</p>
            
            <div class="upload-box">
                <input type="file" id="file-input" style="display: none;" accept="application/pdf" onchange="updateFileName()">
                
                <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                    Seleccionar PDF
                </button>
                
                <p id="file-name-display" style="margin-top: 15px; color: #34d399; font-weight: bold;"></p>
                
                <button id="continue-btn" class="continue-btn">Continuar ➔</button>
            </div>
        </section>

        <section id="mode-selection" style="display: none;">
            <h2>Elige tu modo de juego</h2>
            <div class="mode-grid">
                <div class="mode-card" data-mode="estudio"><h3>Modo Estudio</h3><p>Repasa sin presión</p></div>
                <div class="mode-card" data-mode="puntuacion"><h3>Puntuación</h3><p>Mide tus aciertos</p></div>
                <div class="mode-card" data-mode="examen"><h3>Examen</h3><p>Simulacro real</p></div>
                <div class="mode-card" data-mode="hardcore"><h3>Hardcore</h3><p>Los fallos restan</p></div>
            </div>
        </section>

        <section id="flashcard-area" style="display: none;">
            <div class="progress-bar">
                Pregunta <span id="current-number">0</span> de <span id="total-number">0</span>
            </div>
            <div id="card-container">
                </div>
        </section>

        <section id="results-area" style="display: none;">
            <h2>Resultados Finales</h2>
            <div class="results-stats">
                <p>Aciertos: <span id="correct-res">0</span></p>
                <p>Fallos: <span id="incorrect-res">0</span></p>
                <p>Precisión: <span id="accuracy-res">0%</span></p>
            </div>
            <button class="restart-btn" onclick="restartApp()">Hacer otro test</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
